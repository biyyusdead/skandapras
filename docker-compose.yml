services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lomba_jahos_abiyyu
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "5173:5173"
    environment:
      APP_NAME: "${APP_NAME:-BMT Center KUBE API}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
      DB_CONNECTION: mysql
      DB_HOST: external_mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-bmt_center_kube}"
      DB_USERNAME: "${DB_USERNAME:-pkwu}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      FILESYSTEM_DISK: public
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - app_uploads:/var/www/html/storage/app/public
      - app_storage:/var/www/html/storage/framework
      - app_public:/var/www/html/public
      - app_logs:/var/www/html/storage/logs
    networks:
      - dokploy-network
  # mysql service removed — database runs externally per user request

volumes:
  app_storage:
  app_logs:
  app_uploads:
  app_public:

networks:
  dokploy-network:
    name: dokploy-network
    external: true
